<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface2: #1e2330;
    --surface3: #252d3d;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f2f7;
    --muted: #8a93a8;
    --accent: #4f7bff;
    --accent2: #7c9fff;
    --gold: #e8b85a;
    --gold2: #f5d07a;
    --green: #3ecf8e;
    --red: #f87171;
    --purple: #a78bfa;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-sans: 'DM Sans', system-ui, sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; min-height: 100vh; }

  .app { min-height: 100vh; }

  /* MARKETING SITE */
  .marketing { min-height: 100vh; }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 3rem; border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px); background: rgba(13,15,20,0.85);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); letter-spacing: -0.02em; }
  .nav-links { display: flex; gap: 2rem; align-items: center; }
  .nav-links a { color: var(--muted); font-size: 0.875rem; cursor: pointer; text-decoration: none; transition: color 0.2s; font-weight: 500; }
  .nav-links a:hover { color: var(--text); }
  .nav-btn { background: var(--accent); color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 8px; font-family: var(--font-sans); font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .nav-btn:hover { background: var(--accent2); transform: translateY(-1px); }

  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; padding: 5rem 3rem 4rem; align-items: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -60px; right: -60px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(79,123,255,0.08) 0%, transparent 70%); pointer-events: none; }

  .hero-eyebrow { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(232,184,90,0.1); border: 1px solid rgba(232,184,90,0.2); color: var(--gold); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.35rem 0.75rem; border-radius: 100px; margin-bottom: 1.25rem; }
  .hero-title { font-family: var(--font-display); font-size: 3.2rem; line-height: 1.1; letter-spacing: -0.02em; color: var(--text); margin-bottom: 1.25rem; }
  .hero-title span { color: var(--gold); }
  .hero-desc { color: var(--muted); font-size: 1rem; line-height: 1.7; margin-bottom: 2rem; max-width: 440px; }
  .hero-stats { display: flex; gap: 2rem; margin-bottom: 2rem; }
  .stat-item { text-align: left; }
  .stat-num { font-family: var(--font-display); font-size: 1.75rem; color: var(--text); font-weight: 600; }
  .stat-lbl { font-size: 0.75rem; color: var(--muted); }

  /* LOGIN CARD */
  .login-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 2rem; box-shadow: 0 40px 80px rgba(0,0,0,0.4); }
  .login-card h3 { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 0.25rem; }
  .login-card p { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
  .form-group { margin-bottom: 1rem; }
  .form-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; }
  .form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 0.65rem 0.85rem; color: var(--text); font-family: var(--font-sans); font-size: 0.9rem; transition: border-color 0.2s; outline: none; }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); }
  .login-btn { width: 100%; background: var(--accent); color: white; border: none; border-radius: 8px; padding: 0.75rem; font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
  .login-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .login-demo { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .demo-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 500; }
  .demo-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .demo-chip { background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer; color: var(--muted); transition: all 0.2s; }
  .demo-chip:hover { border-color: var(--accent); color: var(--accent); }
  .error-msg { color: var(--red); font-size: 0.8rem; margin-top: 0.25rem; }

  /* FEATURES */
  .section { padding: 5rem 3rem; }
  .section-label { text-align: center; display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 0.75rem; }
  .section-title { font-family: var(--font-display); font-size: 2.2rem; text-align: center; margin-bottom: 0.75rem; }
  .section-sub { text-align: center; color: var(--muted); max-width: 500px; margin: 0 auto 3rem; line-height: 1.7; }

  .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
  .feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: border-color 0.2s, transform 0.2s; }
  .feature-card:hover { border-color: var(--border2); transform: translateY(-2px); }
  .feature-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; margin-bottom: 1rem; }
  .feature-card h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; }
  .feature-card p { font-size: 0.82rem; color: var(--muted); line-height: 1.65; }

  /* PRICING */
  .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; max-width: 900px; margin: 0 auto; }
  .pricing-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; position: relative; }
  .pricing-card.featured { border-color: var(--accent); background: linear-gradient(135deg, rgba(79,123,255,0.05), var(--surface)); }
  .pricing-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; font-size: 0.7rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 100px; white-space: nowrap; }
  .pricing-plan { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .pricing-price { font-family: var(--font-display); font-size: 2.25rem; font-weight: 700; margin-bottom: 0.25rem; }
  .pricing-price span { font-size: 0.9rem; color: var(--muted); font-family: var(--font-sans); font-weight: 400; }
  .pricing-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.25rem; }
  .pricing-features { list-style: none; margin-bottom: 1.5rem; }
  .pricing-features li { font-size: 0.82rem; color: var(--muted); padding: 0.3rem 0; display: flex; align-items: center; gap: 0.5rem; }
  .pricing-features li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .pricing-btn { width: 100%; border: 1px solid var(--border2); border-radius: 8px; padding: 0.65rem; font-family: var(--font-sans); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; background: transparent; color: var(--text); }
  .pricing-btn.featured { background: var(--accent); color: white; border-color: var(--accent); }
  .pricing-btn:hover { background: var(--surface3); }
  .pricing-btn.featured:hover { background: var(--accent2); }

  /* TESTIMONIALS */
  .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
  .testi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .testi-quote { font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 1.25rem; font-style: italic; }
  .testi-author { display: flex; align-items: center; gap: 0.75rem; }
  .testi-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; flex-shrink: 0; }
  .testi-name { font-size: 0.85rem; font-weight: 600; }
  .testi-role { font-size: 0.75rem; color: var(--muted); }

  /* FOOTER */
  .footer { padding: 2rem 3rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .footer-logo { font-family: var(--font-display); color: var(--gold); font-size: 1.1rem; }
  .footer-text { color: var(--muted); font-size: 0.8rem; }

  /* DASHBOARD */
  .dashboard { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 0; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-logo { font-family: var(--font-display); font-size: 1.2rem; color: var(--gold); padding: 0 1.25rem 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 0.75rem; }
  .sidebar-section { padding: 0 0.75rem; margin-bottom: 0.25rem; }
  .sidebar-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0.5rem 0.5rem 0.25rem; }
  .sidebar-item { display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0.75rem; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 0.85rem; font-weight: 500; transition: all 0.15s; margin-bottom: 2px; }
  .sidebar-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-item.active { background: rgba(79,123,255,0.12); color: var(--accent2); }
  .sidebar-item .icon { font-size: 0.9rem; width: 18px; text-align: center; }
  .sidebar-footer { margin-top: auto; padding: 1rem 0.75rem 0; border-top: 1px solid var(--border); }
  .user-pill { display: flex; align-items: center; gap: 0.65rem; padding: 0.5rem 0.75rem; border-radius: 8px; cursor: pointer; }
  .user-pill:hover { background: var(--surface2); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
  .user-info .name { font-size: 0.8rem; font-weight: 600; color: var(--text); }
  .user-info .role { font-size: 0.7rem; color: var(--muted); }
  .logout-btn { width: 100%; margin-top: 0.5rem; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem; color: var(--muted); font-size: 0.8rem; cursor: pointer; font-family: var(--font-sans); transition: all 0.2s; }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .main-content { flex: 1; overflow-y: auto; background: var(--bg); padding: 2rem; }
  .page-header { margin-bottom: 1.75rem; }
  .page-title { font-family: var(--font-display); font-size: 1.75rem; margin-bottom: 0.25rem; }
  .page-sub { color: var(--muted); font-size: 0.875rem; }

  /* STAT CARDS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.75rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .stat-card-label { font-size: 0.75rem; font-weight: 500; color: var(--muted); margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; }
  .stat-card-value { font-family: var(--font-display); font-size: 2rem; font-weight: 600; line-height: 1; margin-bottom: 0.35rem; }
  .stat-card-change { font-size: 0.75rem; color: var(--green); }
  .stat-card-change.neg { color: var(--red); }

  /* TABLE */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
  .table-title { font-size: 0.9rem; font-weight: 600; }
  .search-bar { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 0.45rem 0.75rem; color: var(--text); font-family: var(--font-sans); font-size: 0.8rem; width: 200px; outline: none; }
  .search-bar:focus { border-color: var(--accent); }
  .search-bar::placeholder { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 0.65rem 1.25rem; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 0.75rem 1.25rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 100px; font-size: 0.7rem; font-weight: 600; }
  .badge-green { background: rgba(62,207,142,0.1); color: var(--green); }
  .badge-blue { background: rgba(79,123,255,0.1); color: var(--accent2); }
  .badge-red { background: rgba(248,113,113,0.1); color: var(--red); }
  .badge-gold { background: rgba(232,184,90,0.1); color: var(--gold); }
  .badge-purple { background: rgba(167,139,250,0.1); color: var(--purple); }

  .action-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 0.25rem 0.6rem; color: var(--muted); font-size: 0.75rem; cursor: pointer; font-family: var(--font-sans); transition: all 0.15s; margin-right: 4px; }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.danger:hover { border-color: var(--red); color: var(--red); }

  .user-dash-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; text-align: center; }

  .profile-name { font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 0.25rem; }
  .profile-email { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

  .ps-num { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
  .ps-lbl { font-size: 0.7rem; color: var(--muted); }

  .sub-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
  .sub-card h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem; }
  .sub-plan { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }

  .progress-fill { height: 100%; border-radius: 100px; transition: width 0.5s ease; }

  .books-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .book-mini { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem; }
  .book-mini h5 { font-size: 0.82rem; font-weight: 600; margin-bottom: 0.25rem; }
  .book-mini .author { font-size: 0.73rem; color: var(--muted); margin-bottom: 0.5rem; }
  .book-mini .due { font-size: 0.7rem; }

  /* BOOKS MANAGEMENT */
  .add-btn { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 0.5rem 1rem; font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .add-btn:hover { background: var(--accent2); }

  /* GRID CHARTS */
  .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .chart-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
  .bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 120px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; transition: opacity 0.2s; cursor: pointer; }
  .bar:hover { opacity: 0.8; }
  .bar-lbl { font-size: 0.65rem; color: var(--muted); }

  .donut-wrap { display: flex; flex-direction: column; gap: 0.5rem; }
  .donut-item { display: flex; align-items: center; gap: 0.65rem; }
  .donut-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .donut-label { flex: 1; font-size: 0.8rem; color: var(--muted); }
  .donut-val { font-size: 0.8rem; font-weight: 600; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(4px); }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 2rem; width: 420px; max-width: 90vw; }
  .modal-title { font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 0.25rem; }
  .modal-sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 1.5rem; }
  .modal-footer { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
  .modal-btn { flex: 1; border-radius: 8px; padding: 0.65rem; font-family: var(--font-sans); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border2); background: transparent; color: var(--text); }
  .modal-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .modal-btn:hover { background: var(--surface2); }
  .modal-btn.primary:hover { background: var(--accent2); }

  .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 0.75rem 1.25rem; font-size: 0.85rem; z-index: 300; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  select { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 0.5rem 0.75rem; color: var(--text); font-family: var(--font-sans); font-size: 0.85rem; outline: none; cursor: pointer; }
  select:focus { border-color: var(--accent); }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.875rem; }

  .section-bg-alt { background: var(--surface); }
</style>

// ============= USER DASHBOARD =============
function UserDashboard({ user, onLogout }) {
  const [activePage, setActivePage] = useState('profile');
  const [toast, setToast] = useState('');
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2500); };

  const subTotal = user.subscription === 'Premium' ? 90 : 30;
  const subPct = user.subDays > 0 ? Math.min(100, Math.round((user.subDays / subTotal) * 100)) : 0;

  const navItems = [
    { id: 'profile', label: 'My Profile', icon: '◎' },
    { id: 'books', label: 'My Books', icon: '▣' },
    { id: 'history', label: 'History', icon: '◈' },
  ];

  const initials = user.name.split(' ').map(n => n[0]).join('');
  const avatarColor = '#4f7bff';

  const renderPage = () => {
    if (activePage === 'profile') return React.createElement('div', null,
      React.createElement('div', { className: 'page-header' },
        React.createElement('h1', { className: 'page-title' }, 'My Dashboard'),
        React.createElement('p', { className: 'page-sub' }, 'Welcome back, ' + user.name.split(' ')[0])
      ),
      React.createElement('div', { className: 'user-dash-grid' },
        React.createElement('div', { className: 'profile-card' },
          React.createElement('div', { className: 'profile-avatar', style: { background: 'rgba(79,123,255,0.15)', color: avatarColor } }, initials),
          React.createElement('div', { className: 'profile-name' }, user.name),
          React.createElement('div', { className: 'profile-email' }, user.email),
          React.createElement('span', { className: user.subscription === 'Premium' ? 'badge badge-gold' : 'badge badge-blue' }, user.subscription + ' Plan'),
          React.createElement('div', { className: 'profile-stats' },
            React.createElement('div', { className: 'ps-item' },
              React.createElement('div', { className: 'ps-num', style: { color: '#3ecf8e' } }, user.booksRead),
              React.createElement('div', { className: 'ps-lbl' }, 'Books read')
            ),
            React.createElement('div', { className: 'ps-item' },
              React.createElement('div', { className: 'ps-num', style: { color: '#4f7bff' } }, user.booksIssued),
              React.createElement('div', { className: 'ps-lbl' }, 'Borrowed now')
            )
          )
        ),
        React.createElement('div', null,
          React.createElement('div', { className: 'sub-card', style: { marginBottom: '1rem' } },
            React.createElement('h3', null, 'Subscription Status'),
            React.createElement('div', { className: 'sub-plan' },
              React.createElement('div', { className: 'sub-plan-name' }, user.subscription + ' Plan'),
              React.createElement('span', { className: user.subscription === 'Premium' ? 'badge badge-gold' : 'badge badge-blue' }, user.subDays > 0 ? user.subDays + ' days left' : 'Expired')
            ),
            React.createElement('div', { className: 'progress-label' },
              React.createElement('span', null, 'Subscription duration'),
              React.createElement('span', null, subPct + '%')
            ),
            React.createElement('div', { className: 'progress-bar' },
              React.createElement('div', { className: 'progress-fill', style: { width: subPct + '%', background: user.subDays < 15 ? '#f87171' : '#4f7bff' } })
            ),
            user.subDays < 20 && React.createElement('p', { style: { fontSize: '0.8rem', color: '#f87171' } }, '⚠ Your subscription expires soon. Renew to keep access.')
          ),
          React.createElement('div', { className: 'sub-card' },
            React.createElement('h3', null, 'Reading Stats'),
            React.createElement('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.75rem' } },
              [['Books Read', user.booksRead, '#3ecf8e'], ['Currently Borrowed', user.booksIssued, '#4f7bff'], ['Member Since', new Date(user.joined).getFullYear(), '#e8b85a']].map(([label, val, color], i) =>
                React.createElement('div', { key: i, style: { background: 'var(--surface2)', borderRadius: '10px', padding: '0.85rem', textAlign: 'center' } },
                  React.createElement('div', { style: { fontFamily: 'var(--font-display)', fontSize: '1.75rem', color, lineHeight: 1, marginBottom: '0.25rem' } }, val),
                  React.createElement('div', { style: { fontSize: '0.72rem', color: 'var(--muted)' } }, label)
                )
              )
            )
          )
        )
      )
    );

    if (activePage === 'books') return React.createElement('div', null,
      React.createElement('div', { className: 'page-header' },
        React.createElement('h1', { className: 'page-title' }, 'My Books'),
        React.createElement('p', { className: 'page-sub' }, user.issuedBooks.length + ' books currently borrowed')
      ),
      user.issuedBooks.length === 0
        ? React.createElement('div', { className: 'empty-state' }, 'No books currently borrowed. Visit the library to check out a book.')
        : React.createElement('div', null,
          React.createElement('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '1rem' } },
            user.issuedBooks.map(book =>
              React.createElement('div', { key: book.id, className: 'table-card', style: { padding: '1.25rem' } },
                React.createElement('div', { style: { width: 36, height: 48, background: 'rgba(79,123,255,0.15)', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '0.75rem', fontSize: '1.1rem' } }, '📖'),
                React.createElement('h4', { style: { fontSize: '0.9rem', marginBottom: '0.25rem' } }, book.title),
                React.createElement('p', { style: { fontSize: '0.78rem', color: 'var(--muted)', marginBottom: '0.75rem' } }, book.author),
                React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem' } },
                  React.createElement('span', { style: { color: 'var(--muted)' } }, 'Issued: ' + book.issued),
                  React.createElement('span', { style: { color: new Date(book.due) < new Date() ? '#f87171' : '#3ecf8e' } }, 'Due: ' + book.due)
                ),
                React.createElement('button', { className: 'action-btn', style: { marginTop: '0.75rem', width: '100%' }, onClick: () => showToast('Return request submitted for: ' + book.title) }, 'Request Return')
              )
            )
          )
        )
    );

    if (activePage === 'history') return React.createElement('div', null,
      React.createElement('div', { className: 'page-header' },
        React.createElement('h1', { className: 'page-title' }, 'Reading History'),
        React.createElement('p', { className: 'page-sub' }, user.booksRead + ' books read total')
      ),
      React.createElement('div', { className: 'table-card' },
        React.createElement('div', { className: 'table-header' },
          React.createElement('span', { className: 'table-title' }, 'Past Books')
        ),
        React.createElement('table', null,
          React.createElement('thead', null,
            React.createElement('tr', null, ['Book Title', 'Author', 'Issued', 'Returned', 'Status'].map(h => React.createElement('th', { key: h }, h)))
          ),
          React.createElement('tbody', null,
            [
              { title: 'Atomic Habits', author: 'James Clear', issued: '2025-02-10', returned: '2025-02-28', status: 'Returned' },
              { title: 'Deep Work', author: 'Cal Newport', issued: '2025-01-15', returned: '2025-02-01', status: 'Returned' },
              { title: 'The Lean Startup', author: 'Eric Ries', issued: '2024-12-01', returned: '2024-12-20', status: 'Returned' },
              { title: 'Zero to One', author: 'Peter Thiel', issued: '2024-11-10', returned: '2024-11-30', status: 'Returned' },
            ].map((row, i) =>
              React.createElement('tr', { key: i },
                React.createElement('td', { style: { fontWeight: 500 } }, row.title),
                React.createElement('td', { style: { color: 'var(--muted)' } }, row.author),
                React.createElement('td', { style: { color: 'var(--muted)' } }, row.issued),
                React.createElement('td', { style: { color: 'var(--muted)' } }, row.returned),
                React.createElement('td', null, React.createElement('span', { className: 'badge badge-green' }, row.status))
              )
            )
          )
        )
      )
    );
  };

  return React.createElement('div', { className: 'dashboard' },
    React.createElement('aside', { className: 'sidebar' },
      React.createElement('div', { className: 'sidebar-logo' }, 'LibraryOS'),
      React.createElement('div', { className: 'sidebar-section' },
        React.createElement('div', { className: 'sidebar-label' }, 'My Library'),
        navItems.map(item =>
          React.createElement('div', { key: item.id, className: `sidebar-item ${activePage === item.id ? 'active' : ''}`, onClick: () => setActivePage(item.id) },
            React.createElement('span', { className: 'icon' }, item.icon),
            item.label
          )
        )
      ),
      React.createElement('div', { className: 'sidebar-footer' },
        React.createElement('div', { className: 'user-pill' },
          React.createElement('div', { className: 'avatar', style: { background: 'rgba(79,123,255,0.2)', color: '#7c9fff', fontSize: '0.65rem' } }, initials),
          React.createElement('div', { className: 'user-info' },
            React.createElement('div', { className: 'name' }, user.name.split(' ')[0]),
            React.createElement('div', { className: 'role' }, user.subscription + ' Member')
          )
        ),
        React.createElement('button', { className: 'logout-btn', onClick: onLogout }, '→ Sign Out')
      )
    ),
    React.createElement('main', { className: 'main-content' }, renderPage()),
    toast && React.createElement('div', { className: 'toast' }, '✓ ' + toast)
  );
}

// ============= ROOT APP =============
function App() {
  const [currentUser, setCurrentUser] = useState(null);

  const handleLogin = (user) => setCurrentUser(user);
  const handleLogout = () => setCurrentUser(null);

  if (!currentUser) return React.createElement(MarketingPage, { onLogin: handleLogin });
  if (currentUser.role === 'Admin') return React.createElement(AdminDashboard, { user: currentUser, onLogout: handleLogout });
  return React.createElement(UserDashboard, { user: currentUser, onLogout: handleLogout });
}

createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
